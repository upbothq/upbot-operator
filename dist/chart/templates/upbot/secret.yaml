{{- if .Values.upbot.apiKey }}
{{- /* The Secret UPBOT_TOKEN reads in manager.env */}}
{{- $name := "upbot-api-key" }}
{{- range .Values.manager.env }}
{{- if eq .name "UPBOT_TOKEN" }}
{{- with .valueFrom }}{{ with .secretKeyRef }}{{ $name = .name }}{{ end }}{{ end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upbot-operator.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.upbot.apiKey | b64enc }}
{{- end }}
