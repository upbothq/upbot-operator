{{- if .Values.cleanup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chart.fullname" . }}-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: cleanup
    spec:
      serviceAccountName: {{ include "chart.fullname" . }}-cleanup
      restartPolicy: Never
      containers:
      - name: cleanup
        image: {{ .Values.cleanup.image.repository }}:{{ .Values.cleanup.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.cleanup.image.pullPolicy }}
        env:
        - name: CLEANUP_TIMEOUT
          value: {{ .Values.cleanup.timeout | quote }}
        - name: CLEANUP_DRY_RUN
          value: {{ .Values.cleanup.dryRun | quote }}
        - name: OPERATOR_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: OPERATOR_DEPLOYMENT
          value: {{ include "chart.managerName" . }}
        - name: INGRESS_WATCHER_ENABLED
          value: {{ .Values.upbot.ingressWatcher.enable | quote }}
        command:
        - /bin/sh
        - -c
        - |
          # The operator still runs during this pre-delete hook: deleting the Monitor resources lets it delete
          # each one from Upbot with its own ID. Monitors created in the Upbot dashboard are never touched.
          log() {
            echo "$(date '+%Y-%m-%d %H:%M:%S') $1"
          }

          list_monitors() {
            kubectl get monitors.monitoring.upbot.app --all-namespaces \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{" "}{.status.externalID}{"\n"}{end}' 2>/dev/null
          }

          count_monitors() {
            list_monitors | grep -c . || true
          }

          log "=== Upbot Operator cleanup started ==="

          if ! kubectl get crd monitors.monitoring.upbot.app >/dev/null 2>&1; then
            log "Monitor CRD not found, nothing to clean up"
            exit 0
          fi

          if [ "$CLEANUP_DRY_RUN" = "true" ]; then
            log "DRY RUN: would delete these Monitor resources and their Upbot monitors:"
            list_monitors | while read -r namespace name id; do
              [ -n "$name" ] && log "  - $namespace/$name (Upbot ID: ${id:-none})"
            done
            exit 0
          fi

          # The Ingress watcher would create the monitors of the Ingresses again as soon as they are deleted:
          # restart the operator without it first
          if [ "$INGRESS_WATCHER_ENABLED" = "true" ]; then
            log "Restarting the operator without the Ingress watcher..."
            kubectl -n "$OPERATOR_NAMESPACE" set env "deployment/$OPERATOR_DEPLOYMENT" UPBOT_UNINSTALLING=true
            kubectl -n "$OPERATOR_NAMESPACE" rollout status "deployment/$OPERATOR_DEPLOYMENT" --timeout=120s \
              || log "WARNING: the operator did not restart in time, monitors from Ingresses may be created again"
          fi

          log "Found $(count_monitors) Monitor resources, deleting them..."
          kubectl delete monitors.monitoring.upbot.app --all --all-namespaces --wait=false

          # The operator removes each finalizer once the monitor is deleted from Upbot
          deadline=$(( $(date +%s) + CLEANUP_TIMEOUT ))
          while [ "$(count_monitors)" -gt 0 ] && [ "$(date +%s)" -lt "$deadline" ]; do
            log "Waiting for the operator, $(count_monitors) Monitor resources left..."
            sleep 5
          done

          remaining=$(count_monitors)
          if [ "$remaining" -eq 0 ]; then
            log "=== All monitors deleted from Kubernetes and Upbot ==="
            exit 0
          fi

          # Don't block the uninstall: release the rest, their Upbot monitors stay and are listed here
          log "WARNING: $remaining Monitor resources were not deleted in time (see the operator logs and their Ready condition)"
          log "Removing their finalizer, delete these monitors in the Upbot dashboard:"
          list_monitors | while read -r namespace name id; do
            [ -z "$name" ] && continue
            log "  - $namespace/$name (Upbot ID: ${id:-none})"
            kubectl -n "$namespace" patch monitors.monitoring.upbot.app "$name" --type=merge -p '{"metadata":{"finalizers":null}}' || true
          done

          log "=== Upbot Operator cleanup completed with warnings ==="
          exit 0
        resources:
          {{- toYaml .Values.cleanup.resources | nindent 10 }}
      {{- with .Values.cleanup.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cleanup.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cleanup.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
